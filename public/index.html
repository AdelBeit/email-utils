<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Finder</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, #fefefe 0%, #f4f4f4 48%, #e8ebf0 100%);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #app {
        width: min(960px, 100%);
        padding: 2rem 1.25rem;
      }
      .app-shell {
        background: #fff;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 16px 35px rgba(15, 23, 42, 0.15);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 2rem;
        text-align: center;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .form-grid input {
        width: 100%;
        padding: 0.65rem 0.7rem;
        border-radius: 6px;
        border: 1px solid #cbd5f5;
        font-size: 0.95rem;
      }
      button {
        font-size: 0.95rem;
        border-radius: 8px;
        border: none;
        padding: 0.65rem 1rem;
        cursor: pointer;
      }
      .primary {
        width: 100%;
        margin-top: 0.25rem;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        transition: transform 0.15s ease;
      }
      .primary:disabled {
        background: #a5b4fc;
        cursor: not-allowed;
      }
      .primary:focus-visible,
      .inline-button:focus-visible,
      button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      .primary:hover:not(:disabled) {
        transform: translateY(-1px);
      }
      .outputs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
      }
      .panel {
        background: #f8fafc;
        border-radius: 12px;
        padding: 1rem;
        border: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
      }
      .pre-wrapper {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .panel-title-wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .panel h2 {
        font-size: 1rem;
        margin: 0;
      }
      .badge {
        font-size: 0.75rem;
        background: #fbbf24;
        color: #1f2937;
        padding: 0.1rem 0.4rem;
        border-radius: 999px;
      }
      .error {
        background: #fee2e2;
        border: 1px solid #fecdd3;
        padding: 0.4rem 0.5rem;
        border-radius: 6px;
        color: #7f1d1d;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        word-break: break-word;
        overflow-wrap: anywhere;
        max-width: 100%;
        white-space: pre-wrap;
        line-height: 1.4;
        letter-spacing: 0.01em;
      }
      pre {
        flex: 1;
        margin: 0;
        padding: 0.75rem;
        border-radius: 8px;
        background: #fff;
        border: 1px solid #cbd5e1;
        font-size: 0.9rem;
        line-height: 1.4;
        overflow: auto;
        min-height: 160px;
      }
      .inline-button {
        margin-top: 0.75rem;
        align-self: flex-start;
        padding: 0.55rem 0.9rem;
        border: 1px solid #475569;
        background: #fff;
        border-radius: 6px;
        color: #0f172a;
        font-weight: 600;
      }
      .inline-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="importmap">
      {
        "imports": {
          "preact": "/modules/preact/dist/preact.mjs",
          "preact/hooks": "/modules/preact/hooks/dist/hooks.mjs"
        }
      }
    </script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
