<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Finder</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f4f4f4;
      }
      .container {
        text-align: center;
        max-width: 100%;
        width: 50%;
      }
      #form {
        max-width: 100%;
        border: solid black 1px;
        padding: 5px;
      }
      #result,
      #error {
        white-space: pre-wrap;
        overflow-wrap: break-word;
        background-color: #f5f5f5;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: monospace;
        text-align: left;
        margin-top: 0.5rem;
      }
      #error {
        color: #a00;
        border-color: #d00;
        background-color: #ffe8e8;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Email Finder</h1>
      <div id="form">
        <form>
          <input type="text" required id="first" placeholder="first name" />
          <input type="text" required id="last" placeholder="last name" />
          <input type="text" required id="domain" placeholder="domain.com" />
          <button type="button" id="submit" onclick="findEmail()">Find</button>
        </form>
        <pre id="result"></pre>
        <div id="error" role="alert" aria-live="polite"></div>
        <button onclick="copyToClipboard()" type="button">Copy Emails</button>
      </div>
    </div>
    <script>
      var emails;
      const resultEl = document.getElementById("result");
      const errorEl = document.getElementById("error");

      function setError(message) {
        if (message) {
          errorEl.textContent = message;
          errorEl.style.display = "block";
        } else {
          errorEl.textContent = "";
          errorEl.style.display = "none";
        }
      }

      function findEmail() {
        const first = document.getElementById("first").value;
        const last = document.getElementById("last").value;
        const domain = document.getElementById("domain").value;
        resultEl.textContent = "loading...";
        setError("");
        fetch("/find-emails", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            firstName: first,
            lastName: last,
            domain: domain,
          }),
        })
          .then(async (response) => {
            const data = await response.json();
            if (!response.ok) {
              throw {
                message: data.error || "Unable to fetch emails",
                detail: data.e,
              };
            }
            return data;
          })
          .then((data) => {
            console.log(data);
            emails = data.emails.join(",");
            resultEl.innerHTML = "verified list: " + emails;
            return emails;
          })
          .then((emails) => navigator.clipboard.writeText(emails))
          .catch((error) => {
            console.error("Error:", error);
            emails = "";
            const message =
              error?.message || "Something went wrong during verification";
            const detail = error?.detail ? ` (${error.detail})` : "";
            resultEl.textContent = message;
            setError(message + detail);
          });
      }

      async function copyToClipboard() {
        if (!emails) {
          return;
        }
        try {
          await navigator.clipboard.writeText(emails);
          console.log("Content copied to clipboard");
        } catch (err) {
          console.error("Failed to copy: ", err);
        }
      }
    </script>
    <script>
      const elements = document.querySelectorAll("#first, #last, #domain, #submit");
      elements[0].setAttribute("tabindex", "0");
      for (let i = 1; i < elements.length; i++) {
        elements[i].setAttribute("tabindex", "-1");
      }
      function rotateTabIndex() {
        let currentElement = Array.from(elements).find(
          (el) => el.getAttribute("tabindex") === "0"
        );
        let currentIndex = Array.from(elements).indexOf(currentElement);
        currentElement.setAttribute("tabindex", "-1");
        let nextIndex = (currentIndex + 1) % elements.length;
        elements[nextIndex].setAttribute("tabindex", "0");
        elements[nextIndex].focus();
      }
      elements.forEach((element) => {
        element.addEventListener("keydown", (event) => {
          if (event.key === "Tab") {
            event.preventDefault();
            rotateTabIndex();
          }
        });
      });
    </script>
  </body>
</html>
